# Local Postgres for development. Production uses Neon via Hyperdrive.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: claudeads
      POSTGRES_PASSWORD: claudeads
      POSTGRES_DB: claudeads
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
